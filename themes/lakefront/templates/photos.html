{% extends "base.html" %}

{% block title %}{{ page.title }} &mdash; {{ SITENAME }}{% endblock %}

{% block content %}
<article class="page-body photos-page-body">
  <div class="photos-header photos-hero-header" style="background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.55)), url('{{ SITEURL }}/images/hero-photos.jpg');">
    <div class="photos-hero-overlay">
      <div class="photos-header-left">
        <h1 class="photos-title"><span class="category-badge" title="Provenance: Mine (Photography)" aria-label="Provenance: Mine"><svg class="category-icon icon-mine" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg></span> {{ page.photos_title or "Chicago Lakefront & Sky" }}</h1>
        <p class="photos-summary"><span class="category-badge" title="Provenance: Mine" aria-label="Provenance: Mine"><svg class="category-icon icon-mine" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg></span> {{ page.summary|striptags or "Photos by Jim Collinsworth." }}</p>
      </div>
      <div class="photos-header-right">
        <a href="https://photos.app.goo.gl/yGTTSd3hnw1pqCPo8" target="_blank" rel="noopener" class="google-photos-badge" title="Open OutOfMyLane on Google Photos">
          <svg class="google-photos-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 12V3a4.5 4.5 0 0 1 4.5 4.5V12H12z" fill="#EA4335"/>
            <path d="M12 12h9a4.5 4.5 0 0 1-4.5 4.5H12V12z" fill="#FBBC04"/>
            <path d="M12 12v9a4.5 4.5 0 0 1-4.5-4.5V12H12z" fill="#34A853"/>
            <path d="M12 12H3a4.5 4.5 0 0 1 4.5-4.5H12V12z" fill="#4285F4"/>
          </svg>
          <span>Google Photos Album &nearr;</span>
        </a>
      </div>
    </div>
  </div>

  <div class="photo-stream gallery-grid">
    {{ page.content }}
  </div>
</article>
{% endblock %}
