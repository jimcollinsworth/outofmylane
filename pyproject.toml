[project]
name = "outofmylane"
version = "0.8.01"
description = "Pelican static site pipeline for outofmylane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "pelican>=4.12.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
